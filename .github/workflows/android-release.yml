name: Android release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: |
          test "$GITHUB_REF_NAME" = "v$(awk -F ': ' '/^version: / {print $2; exit}' pubspec.yaml)"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main

  release:
    needs: validate
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.4
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Configure signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - run: flutter build appbundle --release --flavor production --target lib/main_production.dart
      - run: flutter build apk --release --flavor production --target lib/main_production.dart
      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_CLOUD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: io.opencrafts.academia
          releaseFiles: build/app/outputs/bundle/productionRelease/app-production-release.aab
          tracks: internal
          mappingFile: build/app/outputs/mapping/productionRelease/mapping.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          aab=build/app/outputs/bundle/productionRelease/app-production-release.aab
          apk=build/app/outputs/flutter-apk/app-production-release.apk
          sha256sum "$aab" "$apk" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "$aab" "$apk" SHA256SUMS.txt
