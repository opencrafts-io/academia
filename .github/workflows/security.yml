name: Analyse the code quality and check for security issues

on:
  pull_request:
    branches: [ main, staging ]

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set Short SHA
        run: echo "SHA7=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Analyze code
        id: analyze
        continue-on-error: true
        run: flutter analyze > analyze_report_${{ env.SHA7 }}.txt 2>&1
      
      - name: Vuln scan (Trivy)
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          output: 'trivy_report_${{ env.SHA7 }}.txt'

      - name: Send All Reports to Discord
        if: always()
        env:
          PR_TITLE: ${{ github.event.pull_request.title || github.ref_name }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref || 'default' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ANALYZE_STATUS="${{ steps.analyze.outcome }}"
          TRIVY_STATUS="${{ steps.trivy.outcome }}"
          if [[ "$ANALYZE_STATUS" == "success" && "$TRIVY_STATUS" == "success" ]]; then
            STATUS="All clear"
          else
            STATUS="Needs a quick tune-up"
          fi
          MSG="$(cat <<EOF
          **Security check for $PR_TITLE**
          **Status**: $STATUS
          **Code analysis**: $ANALYZE_STATUS
          **Trivy scan**: $TRIVY_STATUS
          **Branch**: \`$HEAD_REF\` → \`$BASE_REF\`
          If a check failed, download the reports below or run \`flutter analyze\` and \`trivy fs .\` locally.
          **Run**: $RUN_URL
          EOF
          )"
          
          curl -H "Content-Type: multipart/form-data" \
               -F "content=$MSG" \
               -F "file1=@analyze_report_${{ env.SHA7 }}.txt" \
               -F "file2=@trivy_report_${{ env.SHA7 }}.txt" \
               ${{ secrets.DISCORD_WEBHOOK }}

      - name: Upload analyze report to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-quality-reports
          path: |
            analyze_report_${{ env.SHA7 }}.txt
            trivy_report_${{ env.SHA7 }}.txt
