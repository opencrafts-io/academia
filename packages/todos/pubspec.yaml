name: todos
description: Academia todo lists, tasks, and reminders.
publish_to: none

environment:
  sdk: ^3.13.2
  flutter: ">=1.17.0"

dependencies:
  analytics:
    path: ../analytics/
  core:
    path: ../core/
  database:
    path: ../database/
  dartz: ^0.10.1
  dio: ^5.11.0
  equatable: ^2.0.7
  flex_color_picker: ^3.8.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
