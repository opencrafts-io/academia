group = "com.khanhtq.app_blocker"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.3.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.0.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Built-in Kotlin: this plugin must not apply the Kotlin Gradle Plugin itself.
// AGP 9 compiles Kotlin on its own, and the Flutter Gradle plugin applies KGP for
// us on older AGP. Applying it here breaks builds on AGP 9.
apply plugin: "com.android.library"

android {
    namespace = "com.khanhtq.app_blocker"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
        consumerProguardFiles("consumer-rules.pro")
    }

    dependencies {
        implementation("androidx.core:core-ktx:1.18.0")
        implementation("androidx.work:work-runtime-ktx:2.11.2")
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
        implementation("com.google.code.gson:gson:2.14.0")
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.18.0")
        testImplementation("org.mockito.kotlin:mockito-kotlin:5.4.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
